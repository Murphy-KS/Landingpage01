<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style type="text/css">
      .box {
        background-color: red;
        border: 1px solid rgb(100 100 100);
        width: 250px;
        height: 250px;
        animation-name: animate-box-bgcolor, animate-box-position;
        animation-duration: 10s, 10s;
        animation-timing-function: linear, ease-in-out;
        animation-iteration-count: 1, 1;
        /*animation:
          animate-box-bgcolor 10s linear infinite,
          animate-box-position 10s ease-in-out infinite;
      */
      }
      @keyframes animate-box-bgcolor {
        0%,
        100% {
          background-color: red;
        }
        33% {
          background-color: green;
        }
        66% {
          background-color: blue;
        }
      }
      @keyframes animate-box-position {
        0% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(50px, 50px);
        }
        100% {
          transform: translate(0px, 0px);
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
